name: Build prototype

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build PK3
        run: python tools/build.py

      - name: Smoke test
        run: python tools/smoke_test.py

      - name: Gameplay contract test
        run: python tools/test_gameplay_contract.py

      - name: Difficulty modes contract test
        run: python tools/test_difficulty_modes_contract.py

      - name: Save/load state contract test
        run: python tools/test_save_load_state_contract.py

      - name: GZDoom save/load runtime validation contract test
        run: python tools/test_gzdoom_save_load_smoke_contract.py

      - name: SWIR README PRO v2 contract test
        run: python tools/test_readme_standard_contract.py

      - name: SWIR Progress SVG PRO contract test
        run: python tools/generate_progress_svgs.py --check

      - name: Closing Time layout contract test
        run: python tools/test_closing_time_layout.py

      - name: Staff Only route contract test
        run: python tools/test_staff_room_contract.py

      - name: Closing Time presentation contract test
        run: python tools/test_closing_time_presentation_contract.py

      - name: Closing Time environment polish contract test
        run: python tools/test_environment_polish_contract.py

      - name: Closing Time secrets + joke interactions contract test
        run: python tools/test_closing_time_secrets_contract.py

      - name: Closing Time encounter pacing contract test
        run: python tools/test_closing_time_pacing_contract.py

      - name: Final HUD contract test
        run: python tools/test_hud_contract.py

      - name: Accessibility contract test
        run: python tools/test_accessibility_contract.py

      - name: Overtime environmental hazard contract test
        run: python tools/test_overtime_hazard_contract.py

      - name: Boss + escape contract test
        run: python tools/test_boss_escape_contract.py

      - name: Original visual/audio asset contract test
        run: python tools/test_original_assets.py

      - name: Combat audio polish contract test
        run: python tools/test_combat_audio_polish.py

      - name: Original soundtrack contract test
        run: python tools/test_music_contract.py

      - name: Vehicle enemy asset contract test
        run: python tools/test_vehicle_enemy_assets.py

      - name: Regional Manager boss contract test
        run: python tools/test_regional_manager_contract.py

      - name: Bootstrap contract test
        run: python tools/test_bootstrap_contract.py

      - name: Build portable Windows package
        run: python tools/package_portable.py

      - name: Portable package contract test
        run: python tools/test_portable_package.py

      - name: Upload prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkout-of-hell-prototype
          path: dist/checkout-of-hell-prototype.pk3
          if-no-files-found: error

      - name: Upload portable Windows development artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkout-of-hell-windows-portable-dev
          path: |
            dist/CHECKOUT-OF-HELL-Windows-Portable-dev.zip
            dist/CHECKOUT-OF-HELL-Windows-Portable-dev.zip.sha256
          if-no-files-found: error

  runtime-resolution:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve pinned official runtime assets
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\tools\bootstrap_runtime.ps1 -DryRun

      - name: Validate portable Python source
        shell: powershell
        run: .\tools\bootstrap_python.ps1 -DryRun

      - name: Parse prototype with pinned GZDoom
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\tools\gzdoom_runtime_smoke.ps1

      - name: Upload Windows GZDoom parser log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gzdoom-windows-parser-log
          path: dist/gzdoom-runtime-smoke.log
          if-no-files-found: warn

  runtime-state-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build current prototype
        run: python tools/build.py

      - name: Resolve pinned official Linux runtime assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/bootstrap_linux_runtime.py

      - name: Install pinned GZDoom and headless renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          sudo apt-get install -y ./external/linux/gzdoom-pinned-amd64.deb
          command -v gzdoom

      - name: Save, exit and reload current prototype with pinned GZDoom
        timeout-minutes: 3
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: xvfb-run -a --server-args="-screen 0 1280x720x24" python tools/gzdoom_save_load_smoke_linux.py

      - name: Upload Linux GZDoom save/load log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gzdoom-linux-save-load-smoke-log
          path: |
            dist/gzdoom-save-load-linux-smoke.log
            dist/save-load-runtime-linux/*.log
            dist/save-load-runtime-linux/*.cfg
            external/linux/runtime-manifest.json
          if-no-files-found: warn
