name: Build prototype

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build PK3
        run: python tools/build.py

      - name: Smoke test
        run: python tools/smoke_test.py

      - name: Gameplay contract test
        run: python tools/test_gameplay_contract.py

      - name: Closing Time layout contract test
        run: python tools/test_closing_time_layout.py

      - name: Staff Only route contract test
        run: python tools/test_staff_room_contract.py

      - name: Closing Time presentation contract test
        run: python tools/test_closing_time_presentation_contract.py

      - name: Closing Time environment polish contract test
        run: python tools/test_environment_polish_contract.py

      - name: Closing Time encounter pacing contract test
        run: python tools/test_closing_time_pacing_contract.py

      - name: Final HUD contract test
        run: python tools/test_hud_contract.py

      - name: Overtime environmental hazard contract test
        run: python tools/test_overtime_hazard_contract.py

      - name: Boss + escape contract test
        run: python tools/test_boss_escape_contract.py

      - name: Original visual/audio asset contract test
        run: python tools/test_original_assets.py

      - name: Combat audio polish contract test
        run: python tools/test_combat_audio_polish.py

      - name: Vehicle enemy asset contract test
        run: python tools/test_vehicle_enemy_assets.py

      - name: Regional Manager boss contract test
        run: python tools/test_regional_manager_contract.py

      - name: Bootstrap contract test
        run: python tools/test_bootstrap_contract.py

      - name: Build portable Windows package
        run: python tools/package_portable.py

      - name: Portable package contract test
        run: python tools/test_portable_package.py

      - name: Upload prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkout-of-hell-prototype
          path: dist/checkout-of-hell-prototype.pk3
          if-no-files-found: error

      - name: Upload portable Windows development artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkout-of-hell-windows-portable-dev
          path: |
            dist/CHECKOUT-OF-HELL-Windows-Portable-dev.zip
            dist/CHECKOUT-OF-HELL-Windows-Portable-dev.zip.sha256
          if-no-files-found: error

  runtime-resolution:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve pinned official runtime assets
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\tools\bootstrap_runtime.ps1 -DryRun

      - name: Validate portable Python source
        shell: powershell
        run: .\tools\bootstrap_python.ps1 -DryRun

      - name: Parse prototype with pinned GZDoom
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\tools\gzdoom_runtime_smoke.ps1

      - name: Upload GZDoom smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gzdoom-runtime-smoke-log
          path: dist/gzdoom-runtime-smoke.log
          if-no-files-found: warn
