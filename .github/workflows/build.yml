name: Build prototype

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build PK3
        run: python tools/build.py

      - name: Smoke test
        run: python tools/smoke_test.py

      - name: Bootstrap contract test
        run: python tools/test_bootstrap_contract.py

      - name: Upload prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkout-of-hell-prototype
          path: dist/checkout-of-hell-prototype.pk3
          if-no-files-found: error

  runtime-validation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve pinned official runtime assets
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\tools\bootstrap_runtime.ps1 -DryRun

      - name: Validate portable Python source
        shell: powershell
        run: .\tools\bootstrap_python.ps1 -DryRun

      - name: Build prototype for runtime validation
        shell: powershell
        run: python .\tools\build.py

      - name: Download pinned runtime from official sources
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\tools\bootstrap_runtime.ps1

      - name: GZDoom startup smoke MAP01
        shell: powershell
        run: .\tools\runtime_smoke.ps1 -Map MAP01

      - name: GZDoom startup smoke MAP02
        shell: powershell
        run: .\tools\runtime_smoke.ps1 -Map MAP02
